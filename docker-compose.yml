services:
  web:
    image: php:8.3-apache
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html
      - ./src:/var/www/src
      - ./config.php:/var/www/config.php
      - ./composer.json:/var/www/composer.json
      - ./vendor:/var/www/vendor
    depends_on:
      - db
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql &&
      apache2-foreground"

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: aaaa
      MYSQL_DATABASE: tablon_nuncios
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: aaaa
    depends_on:
      - db

volumes:
  mysql_data: